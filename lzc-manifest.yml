application:
  subdomain: walle
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://web:80/
services:
  web:
    # upstream: alenx/walle-web:2.2
    image: docker.1ms.run/alenx/walle-web:2.2
    depends_on:
      - python
  python:
    # upstream: alenx/walle-python:2.2
    image: docker.1ms.run/alenx/walle-python:2.2
    environment:
      - MYSQL_USER=root
      - MYSQL_PASSWORD={{ stable_secret "mysql_password" }}
      - MYSQL_DATABASE=walle
      - MYSQL_ROOT_PASSWORD={{ stable_secret "mysql_password" }}
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
    command: bash -c "cd /opt/walle_home/ && /bin/bash admin.sh migration && python waller.py"
    depends_on:
      - db
    binds:
      - /lzcapp/var/plugins:/opt/walle_home/plugins/
      - /lzcapp/var/codebase:/opt/walle_home/codebase/
      - /lzcapp/var/logs:/opt/walle_home/logs/
      - /lzcapp/var/.ssh:/root/.ssh/
  db:
    # upstream: mysql:8.0.46
    image: docker.1ms.run/library/mysql:8.0.46
    environment:
      - MYSQL_PASSWORD={{ stable_secret "mysql_password" }}
      - MYSQL_DATABASE=walle
      - MYSQL_ROOT_PASSWORD={{ stable_secret "mysql_password" }}
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    binds:
      - /lzcapp/var/db:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h db -u $$MYSQL_USER --password=$$MYSQL_PASSWORD
      start_period: 90s
